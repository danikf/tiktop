name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: tiktop.exe
            output_name: tiktop.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: tiktop
            output_name: tiktop
          - os: macos-latest
            rid: osx-x64
            binary: tiktop
            output_name: tiktop-macos

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Publish single-file
        env:
          CI: true
        run: >
          dotnet publish tiktop/tiktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Rename artifact
        if: matrix.binary != matrix.output_name
        run: mv publish/${{ matrix.rid }}/${{ matrix.binary }} publish/${{ matrix.rid }}/${{ matrix.output_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktop-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/${{ matrix.output_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
