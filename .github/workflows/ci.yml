name: CI

on:
  push:
    branches: [ master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: tiktop.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: tiktop

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish tiktop/tiktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishSingleFile=true
          --self-contained
          -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktop-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download win-x64
        uses: actions/download-artifact@v4
        with:
          name: tiktop-win-x64
          path: dist/win-x64

      - name: Download linux-x64
        uses: actions/download-artifact@v4
        with:
          name: tiktop-linux-x64
          path: dist/linux-x64

      - name: Make linux binary executable
        run: chmod +x dist/linux-x64/tiktop

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win-x64/tiktop.exe
            dist/linux-x64/tiktop
          generate_release_notes: true
