name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - rid: win-x64
            artifact: tiktop.exe
          - rid: linux-x64
            artifact: tiktop

    steps:
      - name: Checkout tiktop
        uses: actions/checkout@v4
        with:
          path: tiktop

      # tik4net is a ProjectReference at ../../../tik4net/... relative to tiktop.csproj.
      # From tiktop/tiktop/tiktop/ going ../../.. lands at tiktop/, so tik4net must be
      # checked out into tiktop/tik4net to satisfy the path.
      - name: Checkout tik4net
        uses: actions/checkout@v4
        with:
          repository: danikf/tik4net
          path: tiktop/tik4net

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish ${{ matrix.rid }}
        working-directory: tiktop/tiktop/tiktop
        run: |
          dotnet publish \
            -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            --self-contained \
            -c Release \
            -o ../../../publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktop-${{ matrix.rid }}
          path: tiktop/publish/${{ matrix.rid }}/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download win-x64
        uses: actions/download-artifact@v4
        with:
          name: tiktop-win-x64
          path: dist/win

      - name: Download linux-x64
        uses: actions/download-artifact@v4
        with:
          name: tiktop-linux-x64
          path: dist/linux

      - name: Make linux binary executable
        run: chmod +x dist/linux/tiktop

      - name: Rename artifacts
        run: |
          mv dist/win/tiktop.exe    dist/tiktop-${{ github.ref_name }}-win-x64.exe
          mv dist/linux/tiktop      dist/tiktop-${{ github.ref_name }}-linux-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: tiktop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/tiktop-${{ github.ref_name }}-win-x64.exe
            dist/tiktop-${{ github.ref_name }}-linux-x64
